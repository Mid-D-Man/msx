# wrangler.toml
#
# Cloudflare Pages project config for the MSX site. Deployment itself
# goes through cloudflare/wrangler-action in
# .github/workflows/cloudflare-pages.yml (`wrangler pages deploy`, not
# run by hand) — this file exists so the project's build output
# directory and name are declared in one place either tool can read,
# and so `wrangler pages dev site/` works for previewing a local build
# of site/ before pushing.
#
# name must match `--project-name=msx` in cloudflare-pages.yml's own
# `wrangler pages deploy` command exactly — wrangler resolves the
# Cloudflare Pages project by this name, and creates the project under
# it on the first successful deploy if it doesn't exist yet.
#
# No [build] table: Pages' own wrangler.toml reader rejects that table
# outright ("Configuration file for Pages projects does not support
# `build`" — hard error, not a warning) — CI
# (.github/workflows/cloudflare-pages.yml) already builds `site/` itself
# via the Rust toolchain, the compiled examples/CI corpus, and
# scripts/site/build_site.py before wrangler ever runs, so there was
# never anything for a [build] section to do here anyway; it was
# removed, not replaced.

name = "msx"
pages_build_output_dir = "site"
