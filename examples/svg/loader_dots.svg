<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80" viewBox="0 0 200 80">
  <rect width="200" height="80" fill="#0f1220"/>
  <g fill="#4a9eff">
    <circle cx="50" cy="40" r="10">
      <animate attributeName="r" values="10;16;10" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="40" r="10">
      <animate attributeName="r" values="10;16;10" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="40" r="10">
      <animate attributeName="r" values="10;16;10" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
