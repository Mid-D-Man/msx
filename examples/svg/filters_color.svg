<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="0.5" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#3ea6ff"/>
    </linearGradient>
    <filter id="mono" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="hue">
      <feColorMatrix type="hueRotate" values="90"/>
    </filter>
    <filter id="smear" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8 0"/>
    </filter>
  </defs>
  <rect width="240" height="160" fill="#0f1220"/>
  <rect x="10" y="10" width="50" height="50" rx="6" fill="url(#ramp)"/>
  <rect x="70" y="10" width="50" height="50" rx="6" fill="url(#ramp)" filter="url(#mono)"/>
  <rect x="130" y="10" width="50" height="50" rx="6" fill="url(#ramp)" filter="url(#hue)"/>
  <rect x="190" y="10" width="40" height="50" rx="6" fill="url(#ramp)" filter="url(#smear)"/>
  <rect x="10" y="70" width="50" height="50" rx="6" fill="url(#ramp)" style="filter: sepia(0.9)"/>
  <rect x="70" y="70" width="50" height="50" rx="6" fill="url(#ramp)" style="filter: invert(1)"/>
  <rect x="130" y="70" width="50" height="50" rx="6" fill="url(#ramp)" style="filter: contrast(1.6) saturate(1.5)"/>
  <rect x="190" y="70" width="40" height="50" rx="6" fill="url(#ramp)" style="filter: grayscale(100%) opacity(0.6)"/>
  <rect x="10" y="130" width="220" height="20" rx="6" fill="url(#ramp)" style="filter: hue-rotate(0.5turn) brightness(1.2)"/>
</svg>
