<svg xmlns="http://www.w3.org/2000/svg" width="240" height="140" viewBox="0 0 240 140">
  <style>
    @keyframes fill { from { transform: scale(0.0001, 1) } to { transform: scale(1, 1) } }
    .bar { transform-origin: 20px 110px; animation: fill 2s steps(5) infinite }
  </style>
  <rect width="240" height="140" fill="#0f1220"/>
  <rect x="20" y="104" width="200" height="12" rx="2" fill="#1d2540"/>
  <rect class="bar" x="20" y="104" width="200" height="12" rx="2" fill="#2ecc71"/>
  <rect x="20" y="20" width="60" height="40" fill="#4a9eff" display="none">
    <set attributeName="display" to="inline" begin="1s"/>
  </rect>
  <circle cx="125" cy="40" r="18" fill="#f7971e" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.5s"/>
  </circle>
  <circle cx="190" cy="40" r="10" fill="#e94560">
    <animate attributeName="visibility" values="visible;hidden;visible" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
