<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120">
  <rect width="240" height="120" fill="#0f1220"/>
  <circle cx="50" cy="60" r="24" fill="#ff5a5f" stroke="#ffffff" stroke-width="2">
    <animate attributeName="fill" values="#ff5a5f;#4a9eff;#2ecc71;#ff5a5f" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="60" r="24" fill="#ff5a5f" stroke="#ffffff" stroke-width="2">
    <animate attributeName="fill" values="#ff5a5f;#4a9eff;#2ecc71;#ff5a5f" dur="3s" begin="-1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="190" cy="60" r="24" fill="#ff5a5f" stroke="#ffffff" stroke-width="2">
    <animate attributeName="fill" values="#ff5a5f;#4a9eff;#2ecc71;#ff5a5f" dur="3s" begin="-2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="2;8;2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
