# .github/workflows/pages.yml  (replaces .github/workflows/buid-deploy.yml — delete that file)
name: MSX — Bench, Report, Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group:   pages
  cancel-in-progress: true

jobs:
  build-and-report:
    runs-on: ubuntu-latest
    if: ${{ vars.AUTO_RUN_ENABLED != 'false' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout MSX
        uses: actions/checkout@v4

      - name: Checkout MBFA (sibling path dependency)
        run: |
          git clone --depth 1 "https://github.com/Mid-D-Man/mbfa.git" \
            "$(dirname "$GITHUB_WORKSPACE")/mbfa"
          git config --global --add safe.directory \
            "$(dirname "$GITHUB_WORKSPACE")/mbfa"

      - name: Checkout DixScript (sibling path dependency)
        run: |
          PARENT=$(dirname "$GITHUB_WORKSPACE")
          git clone --depth 1 "https://github.com/Mid-D-Man/DixScript-Rust.git" \
            "$PARENT/DixScript-Rust"
          git config --global --add safe.directory "$PARENT/DixScript-Rust"
          ln -s "$PARENT/DixScript-Rust/dixscript" "$PARENT/dixscript"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ../mbfa/target
            ../DixScript-Rust/target
          key: msx-pages-v1-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: msx-pages-v1-

      # ── Tests ─────────────────────────────────────────────────────────────────
      # Correctness gating (clippy + the full --workspace debug+release test
      # matrix) lives in ci.yml, which runs on every PR before it reaches main.
      # These two runs stay here only as a last check before publishing a
      # report — covers e.g. an admin direct-push to main bypassing ci.yml's
      # gate — not a replacement for it.
      #
      # Both carry --workspace (see ci.yml's comment for why) and an explicit
      # pipefail shell. GitHub's docs say bash steps default to `-eo
      # pipefail`, but `command | tee file` has reportedly still exited 0 on
      # hosted runners regardless (actions/runner#1955,
      # actions/runner-images#4459) — setting it explicitly removes any doubt
      # rather than trusting the documented default.
      - name: Create results dir
        run: mkdir -p results

      - name: Run tests (debug)
        run: cargo test --workspace 2>&1 | tee results/test_debug.txt
        shell: bash --noprofile --norc -eo pipefail {0}

      - name: Run tests (release)
        run: cargo test --workspace --release 2>&1 | tee results/test_release.txt
        shell: bash --noprofile --norc -eo pipefail {0}

      # ── Build ─────────────────────────────────────────────────────────────────
      # --workspace: without it this built only the root facade package,
      # which has no [[bin]] of its own — meaning target/release/msx (the CLI
      # binary the next step shells out to) was never actually produced.
      - name: Build release binary
        run: cargo build --workspace --release

      # ── Benchmarks ────────────────────────────────────────────────────────────
      - name: Run criterion benchmarks
        timeout-minutes: 12
        run: |
          cargo bench --bench compare -- \
            --output-format bencher \
            --measurement-time 5 \
            --sample-size 20 \
            | tee results/bench_raw.txt || true
          echo "Bench lines: $(grep -c 'bench:' results/bench_raw.txt || echo 0)"

      # ── Example rendering + corpus stats ──────────────────────────────────────
      # For every .msx file in examples/:
      #   1. Compile (source → MBFA binary) and record binary size
      #   2. Render  (source → SVG export)  and record SVG size
      #   3. Rasterize (source → native PNG via msx-render-cpu) — MSX's
      #      primary output, used by the report's "Rendered Visual" pane.
      #      Kept separate from the size-comparison columns below: PNG is a
      #      raster format with very different scaling behavior than the two
      #      vector formats being compared there, so it's not an apples-to-
      #      apples size metric — it's purely for the visual gallery.
      #   4. Roundtrip test to verify decode integrity
      - name: Render examples and collect corpus stats
        run: |
          BIN=./target/release/msx
          mkdir -p results/svgs results/pngs results/gifs
          {
            printf 'FILE,SOURCE_BYTES,BINARY_BYTES,SVG_BYTES,BIN_PCT,SVG_PCT,ROUNDTRIP\n'
            for src in examples/*.msx; do
              [ -f "$src" ] || continue
              stem=$(basename "${src%.msx}")
              src_bytes=$(wc -c < "$src")

              # Compile to MBFA-compressed binary
              if "$BIN" compile "$src" -o "/tmp/${stem}.msx" 2>/dev/null; then
                bin_bytes=$(wc -c < "/tmp/${stem}.msx")
              else
                echo "  WARN: compile failed for $stem" >&2
                bin_bytes=0
              fi

              # Render source directly to SVG (export path)
              if "$BIN" render "$src" -o "results/svgs/${stem}.svg" 2>/dev/null; then
                svg_bytes=$(wc -c < "results/svgs/${stem}.svg")
              else
                echo "  WARN: render failed for $stem" >&2
                svg_bytes=0
              fi

              # Rasterize to native PNG (primary output path) — failure here
              # is non-fatal to the stats row; examples.json just won't have
              # a png_base64 for this one and the report falls back to the
              # inline SVG for that single card.
              "$BIN" rasterize "$src" -o "results/pngs/${stem}.png" 2>/dev/null || \
                echo "  WARN: rasterize failed for $stem" >&2

              # Animate (msx-anim resolve_at_time, sampled to a looping
              # GIF) — expected to fail for the majority of examples that
              # have no animation tracks; that's not a warning, just a
              # static scene, so it's silent unless it errors for another
              # reason. The report falls back to the static PNG when no
              # GIF exists for a given example.
              "$BIN" animate "$src" -o "results/gifs/${stem}.gif" 2>/dev/null || true

              denom=$([ "$src_bytes" -gt 0 ] && echo "$src_bytes" || echo 1)
              bin_pct=$(awk "BEGIN{printf \"%.1f\",$bin_bytes/$denom*100}")
              svg_pct=$(awk "BEGIN{printf \"%.1f\",$svg_bytes/$denom*100}")

              # Roundtrip: source → binary → SVG must be pixel-perfect
              "$BIN" roundtrip "$src" 2>/dev/null && rt="PASS" || rt="FAIL"

              printf '%s,%d,%d,%d,%s,%s,%s\n' \
                "$stem" "$src_bytes" "$bin_bytes" "$svg_bytes" \
                "$bin_pct" "$svg_pct" "$rt"

              rm -f "/tmp/${stem}.msx"
            done
          } | tee results/corpus.csv

      # ── Debug artifacts ─────────────────────────────────────────────────────
      # The report embeds these as base64 (downscaled by the browser to fit a
      # card), which is fine for browsing but bad for actually diagnosing a
      # render — no way to zoom, no way to A/B the animated GIF against the
      # static (unanimated, t=0) PNG for the same example to tell a real
      # compositing bug apart from GIF color-quantization/dithering
      # artifacts. Upload the raw files so both are one click away instead.
      - name: Upload raw render outputs (debug artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: raw-renders
          path: |
            results/pngs
            results/gifs
            results/svgs
          retention-days: 14
          if-no-files-found: warn

      # ── Build examples.json for the report ────────────────────────────────────
      # Combines rendered SVG content, the native PNG raster (base64,
      # self-contained — no extra asset files needed at deploy time), source
      # text, and compression stats into a single JSON so the Python report
      # generator stays stateless.
      - name: Build examples.json
        run: |
          python3 - <<'PYEOF'
          import json, os, glob, base64

          # Read corpus stats into a lookup dict
          stats = {}
          try:
              with open('results/corpus.csv') as f:
                  for line in f.readlines()[1:]:   # skip header
                      parts = line.strip().split(',')
                      if len(parts) >= 7:
                          stats[parts[0]] = {
                              'source_bytes': int(parts[1]),
                              'binary_bytes': int(parts[2]),
                              'svg_bytes':    int(parts[3]),
                              'bin_pct':      float(parts[4]),
                              'svg_pct':      float(parts[5]),
                              'pass':         parts[6] == 'PASS',
                          }
          except Exception as e:
              print(f"WARN: could not read corpus.csv: {e}")

          results = []
          for svg_path in sorted(glob.glob('results/svgs/*.svg')):
              stem     = os.path.splitext(os.path.basename(svg_path))[0]
              src_path = f'examples/{stem}.msx'
              png_path = f'results/pngs/{stem}.png'
              gif_path = f'results/gifs/{stem}.gif'

              if not os.path.exists(src_path):
                  continue

              with open(svg_path, 'r', errors='replace') as f:
                  svg_content = f.read()
              with open(src_path, 'r', errors='replace') as f:
                  source = f.read()

              png_base64 = ''
              if os.path.exists(png_path):
                  with open(png_path, 'rb') as f:
                      png_base64 = base64.b64encode(f.read()).decode('ascii')

              anim_gif_base64 = ''
              if os.path.exists(gif_path):
                  with open(gif_path, 'rb') as f:
                      anim_gif_base64 = base64.b64encode(f.read()).decode('ascii')

              # Simple text heuristic, not a real parse — reliable enough
              # since `type = "shader"` is the literal required DixScript
              # syntax for a shader def (see msx-parser/src/gradient.rs).
              # Drives a report badge only; doesn't affect rendering.
              uses_shader = 'type = "shader"' in source

              row = stats.get(stem, {})
              entry = {
                  'name':            stem,
                  'source':          source,
                  'svg':             svg_content,
                  'png_base64':      png_base64,
                  'anim_gif_base64': anim_gif_base64,
                  'uses_shader':     uses_shader,
                  'source_bytes':    row.get('source_bytes', os.path.getsize(src_path)),
                  'binary_bytes':    row.get('binary_bytes', 0),
                  'svg_bytes':       row.get('svg_bytes',    os.path.getsize(svg_path)),
                  'bin_pct':         row.get('bin_pct', 0.0),
                  'svg_pct':         row.get('svg_pct', 0.0),
                  'pass':            row.get('pass', False),
              }
              results.append(entry)
              png_note = '' if png_base64 else ' [no native PNG]'
              anim_note = ' [animated]' if anim_gif_base64 else ''
              shader_note = ' [shader]' if uses_shader else ''
              print(f"  {stem}: {entry['source_bytes']}B src "
                    f"→ {entry['binary_bytes']}B bin "
                    f"→ {entry['svg_bytes']}B svg "
                    f"({'PASS' if entry['pass'] else 'FAIL'}){png_note}{anim_note}{shader_note}")

          with open('results/examples.json', 'w') as f:
              json.dump(results, f)
          print(f"examples.json: {len(results)} example(s)")
          PYEOF

      # ── Report generation ─────────────────────────────────────────────────────
      - name: Generate HTML report
        run: |
          python3 .github/pages/generate_report.py \
            --build    "${{ github.run_number }}" \
            --commit   "${GITHUB_SHA:0:8}" \
            --branch   "${{ github.ref_name }}" \
            --tests-d  results/test_debug.txt \
            --tests-r  results/test_release.txt \
            --bench    results/bench_raw.txt \
            --corpus   results/corpus.csv \
            --examples results/examples.json \
            --out      site/index.html

      # ── Pages deployment ──────────────────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ── Step summary ──────────────────────────────────────────────────────────
      - name: Publish Step Summary
        run: |
          echo "## MSX Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`  Commit: \`${GITHUB_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Example compression table" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat results/corpus.csv >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Benchmark extract" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep 'bench:' results/bench_raw.txt | head -40 \
            >> $GITHUB_STEP_SUMMARY || echo "(no bench output yet)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "🔗 [View full visual report](${{ steps.deployment.outputs.page_url }})" \
            >> $GITHUB_STEP_SUMMARY
